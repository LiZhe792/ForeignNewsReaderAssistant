name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    # Keep the runner compatible with the pinned Playwright version.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      READING_TEST_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_frontend.cjs tests/test_speech_player.cjs
      - run: find static browser-extension -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: |
          export READING_TEST_CHROME="$(node -p 'require("playwright").chromium.executablePath()')"
          node --test --test-concurrency=3 --test-timeout=180000 tests/*browser.cjs
      - run: git diff --check
