<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>离线阅读 · Margin</title><link rel="stylesheet" href="/static/hub.css"><link rel="stylesheet" href="/static/offline.css"><link rel="manifest" href="/manifest.webmanifest"><script defer src="/static/offline.js"></script></head><body><header><a href="/">← 在线阅读</a><h1>离线阅读</h1><a href="/hub">账户与工具</a></header><main><p>已保存文章可在关闭 Python 服务后阅读。生词、笔记和位置保存在当前浏览器，恢复连接后同步到原账户。</p><p id="offline-status" role="status"></p><p id="offline-count"></p><button id="offline-sync">同步待存记录</button><button id="offline-export">导出待同步记录</button><div id="offline-conflicts"></div><section id="offline-articles"></section><section id="offline-reader" hidden><h2 id="offline-title"></h2><label>字号<input id="offline-size" type="range" min="16" max="32" value="21"></label><label>阅读主题<select id="offline-theme"><option value="">浅色</option><option value="dark">深色</option><option value="sepia">护眼</option></select></label><article id="offline-body" tabindex="0"></article><button id="offline-save-progress">保存阅读位置</button><button id="offline-delete">移除离线副本</button><form id="offline-word-form"><label>单词<input id="offline-word" required maxlength="60"></label><button id="offline-lookup" type="button">查已保存释义</button><label>释义<input id="offline-meaning" required maxlength="2000"></label><button>暂存生词</button></form><form id="offline-note-form"><label>阅读笔记<textarea id="offline-note" required maxlength="6000"></textarea></label><button>暂存笔记</button></form></section></main></body></html>
